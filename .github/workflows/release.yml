name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  MAP_TILE_URL: ${{ vars.MAP_TILE_URL }}
  MAP_ATTRIBUTION: ${{ vars.MAP_ATTRIBUTION }}
  MAP_USER_AGENT: ${{ vars.MAP_USER_AGENT }}
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  APP_VERSION: ${{ vars.APP_VERSION }}
  GITHUB_REF_TYPE: ${{ github.ref_type }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::Set repository variable API_BASE_URL (https://api.example.com)"
            exit 1
          fi
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Configure Android signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p mobile/android/keystore
          echo "$KEYSTORE" | base64 --decode > mobile/android/keystore/release.jks
          cat > mobile/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore/release.jks
          EOF

      - name: Firebase Android config (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/android/app/google-services.json

      - name: Build APK and AAB
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${APP_VERSION:-1.0.0}"
          fi
          ARGS=(
            "--build-name=${VERSION}"
            "--build-number=${GITHUB_RUN_NUMBER}"
            "--dart-define=API_BASE_URL=${API_BASE_URL}"
          )
          add_define() {
            if [ -n "${2:-}" ]; then ARGS+=("--dart-define=$1=$2"); fi
          }
          add_define MAP_TILE_URL "${MAP_TILE_URL:-}"
          add_define MAP_ATTRIBUTION "${MAP_ATTRIBUTION:-}"
          add_define MAP_USER_AGENT "${MAP_USER_AGENT:-}"
          add_define FIREBASE_API_KEY "${FIREBASE_API_KEY:-}"
          add_define FIREBASE_APP_ID "${FIREBASE_APP_ID:-}"
          add_define FIREBASE_MESSAGING_SENDER_ID "${FIREBASE_MESSAGING_SENDER_ID:-}"
          add_define FIREBASE_PROJECT_ID "${FIREBASE_PROJECT_ID:-}"

          flutter pub get
          flutter build apk --release "${ARGS[@]}"
          flutter build appbundle --release "${ARGS[@]}"

          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/Sharee-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "../dist/Sharee-${VERSION}-${GITHUB_RUN_NUMBER}.aab"
          echo "$VERSION" > ../dist/VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  ios:
    runs-on: macos-15
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate API URL
        run: |
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::Set repository variable API_BASE_URL"
            exit 1
          fi

      - name: Firebase iOS config (optional)
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > mobile/ios/Runner/GoogleService-Info.plist

      - name: Detect signing
        id: signing
        run: |
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ] && [ -n "${IOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets missing; building unsigned IPA."
          fi

      - name: Configure iOS signing
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="build.keychain"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/sharee.mobileprovision"
          if [ -n "${IOS_TEAM_ID:-}" ]; then
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = \"${IOS_TEAM_ID}\";/g" \
              ios/Runner.xcodeproj/project.pbxproj
          fi
          if [ -n "${IOS_BUNDLE_ID:-}" ]; then
            sed -i '' "s/vn\.sharee\.shareeMobile/${IOS_BUNDLE_ID}/g" \
              ios/Runner.xcodeproj/project.pbxproj
          fi

      - name: Build signed IPA
        id: signed_build
        if: steps.signing.outputs.signed == 'true'
        continue-on-error: true
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${APP_VERSION:-1.0.0}"; fi
          if [ -f ios/Podfile ]; then
            (cd ios && pod install)
          fi
          ARGS=("--build-name=${VERSION}" "--build-number=${GITHUB_RUN_NUMBER}" "--dart-define=API_BASE_URL=${API_BASE_URL}")
          if [ -n "${MAP_TILE_URL:-}" ]; then ARGS+=("--dart-define=MAP_TILE_URL=${MAP_TILE_URL}"); fi
          if [ -n "${MAP_ATTRIBUTION:-}" ]; then ARGS+=("--dart-define=MAP_ATTRIBUTION=${MAP_ATTRIBUTION}"); fi
          if [ -n "${MAP_USER_AGENT:-}" ]; then ARGS+=("--dart-define=MAP_USER_AGENT=${MAP_USER_AGENT}"); fi
          if [ -n "${FIREBASE_API_KEY:-}" ]; then
            ARGS+=("--dart-define=FIREBASE_API_KEY=${FIREBASE_API_KEY}")
            ARGS+=("--dart-define=FIREBASE_APP_ID=${FIREBASE_APP_ID}")
            ARGS+=("--dart-define=FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}")
            ARGS+=("--dart-define=FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}")
          fi
          flutter build ipa --release --export-method app-store "${ARGS[@]}"

      - name: Build unsigned iOS app
        if: steps.signing.outputs.signed != 'true' || steps.signed_build.outcome == 'failure'
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${APP_VERSION:-1.0.0}"; fi
          flutter build ios --release --no-codesign
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          mkdir -p ../dist
          zip -qry "../dist/Sharee-${VERSION}-${GITHUB_RUN_NUMBER}-unsigned.ipa" Payload

      - name: Collect signed IPA
        if: steps.signing.outputs.signed == 'true' && steps.signed_build.outcome == 'success'
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${APP_VERSION:-1.0.0}"; fi
          mkdir -p ../dist
          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -1)
          cp "$IPA" "../dist/Sharee-${VERSION}-${GITHUB_RUN_NUMBER}.ipa"

      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && steps.signed_build.outcome == 'success' && env.APPSTORE_KEY_ID != ''
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          IPA=$(find dist -name "*.ipa" -type f | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
