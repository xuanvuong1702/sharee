name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/src/Sharee.Api/Sharee.Api.csproj
      - name: Build
        run: dotnet build backend/tests/Sharee.Tests/Sharee.Tests.csproj -c Release
      - name: Test
        run: dotnet test backend/tests/Sharee.Tests/Sharee.Tests.csproj -c Release --no-build
      - name: Dependency audit
        run: dotnet list backend/src/Sharee.Api/Sharee.Api.csproj package --vulnerable --include-transitive

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.com

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --install-links --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sharee-api backend
      - run: docker build -t sharee-admin apps/admin
