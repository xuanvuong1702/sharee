services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sharee-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharee
      POSTGRES_USER: sharee
      POSTGRES_PASSWORD: sharee
    ports:
      - "5432:5432"
    volumes:
      - sharee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharee -d sharee"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sharee-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: sharee-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Db: Host=db;Port=5432;Database=sharee;Username=sharee;Password=sharee
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__Key: sharee-local-demo-jwt-2f7c9a1e5b8d4c6a0e3f7b9d1c5a8e2f
      Jwt__ExpiryMinutes: "60"
      Auth__ExposeOtp: "true"
      Auth__OtpPepper: local-demo-otp-pepper-7a1c4e9b2d6f8a0c
      Auth__OtpResendSeconds: "0"
      Auth__OtpMaxPerHour: "50"
      Sms__Provider: dev
      Demo__Mode: "true"
      Seed__DemoData: "true"
      Payments__AllowMock: "true"
      Swagger__Enabled: "true"
    ports:
      - "8080:8080"

  admin:
    build:
      context: ../../apps/admin
      dockerfile: Dockerfile
    container_name: sharee-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

  mobile-web:
    build:
      context: ../../apps/mobile
      dockerfile: Dockerfile
    container_name: sharee-mobile-web
    restart: unless-stopped
    ports:
      - "8081:80"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: sharee-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8083:80"

volumes:
  sharee-pgdata:

